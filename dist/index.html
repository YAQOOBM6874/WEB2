<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif; /* خط عصري */
            background: linear-gradient(135deg, #0a0f2b, #1a1f4b);
            color: #e0e6f0;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s;
            position: relative;
        }

        body.day {
            background: linear-gradient(135deg, #f9e79f, #f4d03f);
            color: #333;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAJElEQVQIW2NkYGD4z8DAwMgABXgQ3h/j7gAagACiN4AAAuLi4DwoL9AAAAABJRU5ErkJggg==') repeat;
            animation: twinkle 5s infinite alternate;
            opacity: 0.4;
        }

      
        .star {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: moveStar 10s infinite linear;
        }

        .star.small { width: 2px; height: 2px; }
        .star.medium { width: 4px; height: 4px; }
        .star.large { width: 6px; height: 6px; }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 0.6; transform: translateY(-3px); }
            100% { opacity: 0.3; transform: translateY(0); }
        }

        @keyframes moveStar {
            0% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            50% { transform: translate(50px, 50px) scale(1.2); opacity: 0.4; }
            100% { transform: translate(100px, 100px) scale(1); opacity: 0.8; }
        }

        .meteor {
            position: absolute;
            width: 2px;
            height: 10px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.8), transparent);
            animation: meteorFall 3s infinite linear;
        }

        @keyframes meteorFall {
            0% { transform: translate(0, -20px) rotate(45deg); opacity: 1; }
            100% { transform: translate(200px, 200px) rotate(45deg); opacity: 0; }
        }

        .sun {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #ffcd4a, #ff8c00);
            border-radius: 50%;
            top: 20px;
            left: 20px;
            box-shadow: 0 0 20px #ffcd4a, 0 0 40px rgba(255, 140, 0, 0.3);
            animation: glow 3s infinite alternate, rotateSun 20s linear infinite;
            display: none;
        }

        body.day .sun {
            display: block;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 15px #ffcd4a, 0 0 30px rgba(255, 140, 0, 0.3); }
            100% { box-shadow: 0 0 25px #ffcd4a, 0 0 50px rgba(255, 140, 0, 0.5); }
        }

        @keyframes rotateSun {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            animation: orbit 20s linear infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .planet-1 { 
            width: 50px; 
            height: 50px; 
            background: linear-gradient(145deg, #6a5acd, #483d8b); 
            top: 100px; 
            left: 150px; 
            animation-duration: 15s; 
        }
        .planet-2 { 
            width: 30px; 
            height: 30px; 
            background: linear-gradient(145deg, #ba55d3, #8a2be2); 
            top: 200px; 
            left: 300px; 
            animation-duration: 25s; 
        }

        body.day .planet-1 { background: linear-gradient(145deg, #87ceeb, #4682b4); }
        body.day .planet-2 { background: linear-gradient(145deg, #98fb98, #32cd32); }

        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(200px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(200px) rotate(-360deg); }
        }

        .container {
            background: rgba(10, 15, 43, 0.2);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(163, 191, 250, 0.2);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3), 
                        0 0 15px rgba(163, 191, 250, 0.2);
            text-align: center;
            width: 400px;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 
                        0 0 20px rgba(163, 191, 250, 0.3);
        }

        body.day .container {
            background: rgba(249, 231, 159, 0.2);
            box-shadow: 0 6px 25px rgba(244, 208, 63, 0.3), 
                        0 0 15px rgba(244, 208, 63, 0.2);
        }

        body.day .container:hover {
            box-shadow: 0 10px 30px rgba(244, 208, 63, 0.4), 
                        0 0 20px rgba(244, 208, 63, 0.3);
        }

        h1 {
            font-size: 32px;
            color: #a3bffa;
            margin-bottom: 10px;
            text-shadow: 0 0 8px rgba(163, 191, 250, 0.5);
            animation: neonFlicker 2s infinite alternate;
        }

        body.day h1 {
            color: #d4a017;
            text-shadow: 0 0 8px rgba(244, 208, 63, 0.5);
        }

        @keyframes neonFlicker {
            0% { text-shadow: 0 0 5px rgba(163, 191, 250, 0.4); }
            50% { text-shadow: 0 0 10px rgba(163, 191, 250, 0.6); }
            100% { text-shadow: 0 0 5px rgba(163, 191, 250, 0.4); }
        }

        p {
            font-size: 14px;
            color: #b0c4de;
            margin-bottom: 20px;
        }

        body.day p {
            color: #5a3d00;
        }

        .timer {
            font-size: 48px;
            color: #e0e6f0;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            box-shadow: inset 0 0 15px rgba(163, 191, 250, 0.2), 
                        0 0 20px rgba(163, 191, 250, 0.3);
            margin-bottom: 10px;
            position: relative;
            transform: translateZ(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .timer:hover {
            transform: translateY(-3px);
            box-shadow: inset 0 0 20px rgba(163, 191, 250, 0.3), 
                        0 0 30px rgba(163, 191, 250, 0.4);
        }

        body.day .timer {
            color: #333;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 15px rgba(244, 208, 63, 0.2), 
                        0 0 20px rgba(244, 208, 63, 0.3);
        }

        body.day .timer:hover {
            box-shadow: inset 0 0 20px rgba(244, 208, 63, 0.3), 
                        0 0 30px rgba(244, 208, 63, 0.4);
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(163, 191, 250, 0.2);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4F84F7, #00c6ff);
            transition: width 0.3s ease;
            box-shadow: 0 0 15px rgba(79, 132, 247, 0.6);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.2) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0.2) 75%,
                transparent 75%,
                transparent
            );
            background-size: 20px 20px;
            animation: moveStripes 1s linear infinite;
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 20px 20px; }
        }

        body.day .progress-bar {
            background: linear-gradient(90deg, #f4d03f, #ffeb3b);
            box-shadow: 0 0 15px rgba(244, 208, 63, 0.6);
        }

        .controls button {
            padding: 12px 25px;
            margin: 0 8px;
            font-size: 16px;
            background: linear-gradient(145deg, #4F84F7, #003087);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 132, 247, 0.4), 
                        0 0 15px rgba(79, 132, 247, 0.2);
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .controls button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(79, 132, 247, 0.6), 
                        0 0 20px rgba(79, 132, 247, 0.3);
        }

        .controls button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(79, 132, 247, 0.2);
        }

        body.day .controls button {
            background: linear-gradient(145deg, #f4d03f, #c19c1f);
            box-shadow: 0 4px 12px rgba(244, 208, 63, 0.4), 
                        0 0 15px rgba(244, 208, 63, 0.2);
        }

        body.day .controls button:hover {
            box-shadow: 0 6px 18px rgba(244, 208, 63, 0.6), 
                        0 0 20px rgba(244, 208, 63, 0.3);
        }

        body.day .controls button:active {
            box-shadow: 0 2px 8px rgba(244, 208, 63, 0.2);
        }

        .settings label {
            display: block;
            margin: 12px 0;
            font-size: 15px;
            text-shadow: 0 0 5px rgba(163, 191, 250, 0.3);
        }

        body.day .settings label {
            text-shadow: 0 0 5px rgba(244, 208, 63, 0.3);
        }

        .settings input[type="number"] {
            padding: 10px;
            font-size: 15px;
            border: 2px solid rgba(163, 191, 250, 0.4);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e6f0;
            box-shadow: 0 0 8px rgba(163, 191, 250, 0.2);
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        .settings input[type="number"]:focus {
            border: 2px solid #4F84F7;
            box-shadow: 0 0 12px rgba(79, 132, 247, 0.4);
            outline: none;
        }

        body.day .settings input[type="number"] {
            border-color: rgba(244, 208, 63, 0.4);
            background: rgba(255, 255, 255, 0.2);
            color: #333;
            box-shadow: 0 0 8px rgba(244, 208, 63, 0.2);
        }

        body.day .settings input[type="number"]:focus {
            border: 2px solid #f4d03f;
            box-shadow: 0 0 12px rgba(244, 208, 63, 0.4);
        }

        .settings label[for="custom-sound"] {
            margin-top: 15px;
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .settings input[type="file"] {
            opacity: 0;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }

        .custom-sound-label {
            display: inline-block;
            padding: 12px 20px;
            background: linear-gradient(145deg, #4F84F7, #003087);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 132, 247, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse 2s infinite;
        }

        .custom-sound-label:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 18px rgba(79, 132, 247, 0.6);
        }

        body.day .custom-sound-label {
            background: linear-gradient(145deg, #f4d03f, #c19c1f);
            box-shadow: 0 4px 12px rgba(244, 208, 63, 0.4);
        }

        body.day .custom-sound-label:hover {
            box-shadow: 0 6px 18px rgba(244, 208, 63, 0.6);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #sessionCount {
            font-size: 16px;
            color: #a3bffa;
            margin-top: 12px;
            text-shadow: 0 0 5px rgba(163, 191, 250, 0.4);
        }

        body.day #sessionCount {
            color: #d4a017;
            text-shadow: 0 0 5px rgba(244, 208, 63, 0.4);
        }

        .task-list {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(163, 191, 250, 0.2);
            transition: transform 0.3s ease;
        }

        body.day .task-list {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(244, 208, 63, 0.2);
        }

        .task-list:hover {
            transform: scale(1.02);
        }

        .task-input {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .task-input input {
            flex-grow: 1;
            padding: 10px;
            font-size: 15px;
            border: 2px solid rgba(163, 191, 250, 0.4);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e6f0;
            box-shadow: 0 0 8px rgba(163, 191, 250, 0.2);
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        .task-input input:focus {
            border: 2px solid #4F84F7;
            box-shadow: 0 0 12px rgba(79, 132, 247, 0.4);
            outline: none;
        }

        body.day .task-input input {
            border-color: rgba(244, 208, 63, 0.4);
            background: rgba(255, 255, 255, 0.2);
            color: #333;
            box-shadow: 0 0 8px rgba(244, 208, 63, 0.2);
        }

        body.day .task-input input:focus {
            border: 2px solid #f4d03f;
            box-shadow: 0 0 12px rgba(244, 208, 63, 0.4);
        }

        .task-input button {
            padding: 10px 20px;
            font-size: 15px;
            background: linear-gradient(145deg, #4F84F7, #003087);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 132, 247, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .task-input button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(79, 132, 247, 0.6);
        }

        body.day .task-input button {
            background: linear-gradient(145deg, #f4d03f, #c19c1f);
            box-shadow: 0 4px 12px rgba(244, 208, 63, 0.4);
        }

        body.day .task-input button:hover {
            box-shadow: 0 6px 18px rgba(244, 208, 63, 0.6);
        }

        .tasks {
            list-style: none;
            padding: 0;
        }

        .tasks li {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            font-size: 15px;
            color: #e0e6f0;
            align-items: center;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin: 6px 0;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 10px rgba(163, 191, 250, 0.2);
        }

        .tasks li:hover {
            transform: translateX(6px);
            box-shadow: 0 0 15px rgba(163, 191, 250, 0.3);
        }

        body.day .tasks li {
            color: #333;
            background: rgba(0, 0, 0, 0.1);
            box-shadow: 0 0 10px rgba(244, 208, 63, 0.2);
        }

        body.day .tasks li:hover {
            box-shadow: 0 0 15px rgba(244, 208, 63, 0.3);
        }

        .tasks li .task-check {
            width: 22px;
            height: 22px;
            border: 2px solid #a3bffa;
            border-radius: 50%;
            margin-right: 12px;
            background: transparent;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 8px rgba(163, 191, 250, 0.2);
        }

        body.day .tasks li .task-check {
            border-color: #d4a017;
            box-shadow: 0 0 8px rgba(244, 208, 63, 0.2);
        }

        .tasks li .task-check:hover {
            box-shadow: 0 0 10px rgba(163, 191, 250, 0.4);
        }

        body.day .tasks li .task-check:hover {
            box-shadow: 0 0 10px rgba(244, 208, 63, 0.4);
        }

        .tasks li .task-check.checked {
            background: #4F84F7;
            border-color: #4F84F7;
            box-shadow: 0 0 12px rgba(79, 132, 247, 0.5);
            animation: pulse-check 0.5s ease-in-out, sparkle 0.8s ease-in-out;
        }

        body.day .tasks li .task-check.checked {
            background: #f4d03f;
            border-color: #f4d03f;
            box-shadow: 0 0 12px rgba(244, 208, 63, 0.5);
            animation: pulse-check 0.5s ease-in-out, sparkle 0.8s ease-in-out;
        }

        .tasks li .task-check.checked::after {
            content: '✓';
            color: #fff;
            font-size: 15px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: checkAppear 0.3s ease-in-out forwards;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.6);
        }

        body.day .tasks li .task-check.checked::after {
            color: #333;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.6);
        }

        .tasks li .task-check.checked::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.7) 10%, transparent 10%) 0 0,
                        radial-gradient(circle, rgba(255, 255, 255, 0.7) 10%, transparent 10%) 8px 8px;
            background-size: 16px 16px;
            animation: sparkle 0.8s ease-in-out;
        }

        @keyframes pulse-check {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes sparkle {
            0% { opacity: 0; transform: scale(0); }
            50% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        @keyframes checkAppear {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .tasks li .task-name {
            flex-grow: 1;
            text-align: center;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .tasks li .task-name:hover {
            color: #4F84F7;
            text-shadow: 0 0 8px rgba(79, 132, 247, 0.3);
        }

        body.day .tasks li .task-name:hover {
            color: #f4d03f;
            text-shadow: 0 0 8px rgba(244, 208, 63, 0.3);
        }

    
        .tasks li button {
            background: linear-gradient(145deg, #4F84F7, #003087); 
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 6px 12px;
            font-size: 14px;
            box-shadow: 0 3px 10px rgba(79, 132, 247, 0.3); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .tasks li button:hover {
            transform: scale(1.1);
            background: linear-gradient(145deg, #3A6AD5, #001F5F); 
            box-shadow: 0 5px 15px rgba(79, 132, 247, 0.5);
        }

        body.day .tasks li button {
            background: linear-gradient(145deg, #f4d03f, #c19c1f); 
        }

        body.day .tasks li button:hover {
            background: linear-gradient(145deg, #D4A017, #A67B00); 
            box-shadow: 0 5px 15px rgba(244, 208, 63, 0.5);
        }

        .selected-task {
            font-weight: bold;
            color: #a3bffa;
            text-shadow: 0 0 5px rgba(163, 191, 250, 0.4);
        }

        body.day .selected-task {
            color: #d4a017;
            text-shadow: 0 0 5px rgba(244, 208, 63, 0.4);
        }

        .tasks li.selected {
            background: rgba(255, 255, 255, 0.1);
            border-left: 5px solid #a3bffa;
            box-shadow: 0 0 15px rgba(163, 191, 250, 0.3);
            transform: scale(1.02);
        }

        body.day .tasks li.selected {
            background: rgba(0, 0, 0, 0.1);
            border-left: 5px solid #d4a017;
            box-shadow: 0 0 15px rgba(244, 208, 63, 0.3);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script defer src="main.js"></script></head>
<body class="night">
    <div class="stars"></div>
    <!-- إضافة نجوم متحركة -->
    <div class="star small" style="top: 10%; left: 20%;"></div>
    <div class="star medium" style="top: 30%; left: 40%;"></div>
    <div class="star large" style="top: 50%; left: 70%;"></div>
    <div class="star small" style="top: 70%; left: 10%;"></div>
    <!-- إضافة كويكبات -->
    <div class="meteor" style="top: 5%; left: 5%;"></div>
    <div class="meteor" style="top: 40%; left: 80%; animation-delay: 1s;"></div>
    <div class="sun"></div>
    <div class="planet planet-1"></div>
    <div class="planet planet-2"></div>
    <div class="container">
        <h1>Pomodoro Timer</h1>
        <p>قم بتعيين وقت العمل والاستراحة وابدأ جلسة بومودورو الفعالة!</p>
        <div class="timer" id="timer">
            <span id="minutes">25</span>:<span id="seconds">00</span>
        </div>
        <div class="progress-bar-container" id="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="controls">
            <button id="start">ابدأ</button>
            <button id="pause">إيقاف مؤقت</button>
            <button id="reset">إعادة تعيين</button>
        </div>
        <div class="settings">
            <label>مدة العمل: <input type="number" id="work-duration" value="25" min="0.1" step="0.1"> دقيقة</label>
            <label>مدة الراحة: <input type="number" id="break-duration" value="5" min="0.1" step="0.1"> دقيقة</label>
            <label>مدة الراحة الطويلة: <input type="number" id="long-break-duration" value="15" min="0.1" step="0.1"> دقيقة</label>
            <label for="custom-sound">
                رفع صوت تنبيه مخصص:
                <span class="custom-sound-label">اختر ملف صوتي</span>
                <input type="file" id="custom-sound" accept="audio/*">
            </label>
        </div>
